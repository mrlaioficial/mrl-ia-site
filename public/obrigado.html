<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Pagamento recebido · MRL.AI</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root{--bg:#0c0e11;--panel:#12151a;--line2:rgba(255,255,255,.16);--ink:#ecebe7;--muted:#a3a7af;--accent:#ff6a2b;--accent-ink:#1c0e06}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background-color:var(--bg);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.032) 0 1.5px,transparent 1.5px 26px);color:var(--ink);font:17px/1.6 "Inter","Segoe UI","Helvetica Neue",Arial,sans-serif}
    main{width:min(560px,100%)}
    h1{font:600 clamp(36px,6vw,52px)/1.05 "Bahnschrift","Segoe UI Variable Display","Helvetica Neue",Arial,sans-serif;letter-spacing:-.025em;margin:0 0 16px}
    h1 em{font-style:normal;color:var(--accent)}p{color:var(--muted);margin:0 0 14px}
    .card{background:var(--panel);border:1px solid var(--line2);border-radius:22px;padding:30px;margin:26px 0}
    .card b{color:var(--ink)}
    .btn{display:inline-flex;align-items:center;height:48px;padding:0 24px;border-radius:12px;font-weight:700;background:var(--accent);color:var(--accent-ink);text-decoration:none}
    .btn[hidden]{display:none}a.l{color:var(--accent)}
  </style>
</head>
<body>
  <main>
    <h1>Pagamento <em>recebido.</em></h1>
    <p>Obrigado por assinar o MRL.AI.</p>
    <div class="card">
      <p><b>Enviamos o seu acesso por e-mail</b>, para o endereço usado na compra. Pode levar alguns minutos depois da confirmação do pagamento.</p>
      <p>Não encontrou? Confira a caixa de spam.</p>
    </div>
    <a class="btn" id="login" href="#" hidden>Ir para o painel</a>
    <p style="margin-top:22px"><a class="l" href="index.html">Voltar ao site</a></p>
  </main>
  <script>
    fetch("config.json", {cache: "no-cache"}).then(function (r) { return r.json(); }).then(function (c) {
      var u = (c.appUrl || "").replace(/\/$/, "");
      if (/^https:\/\//i.test(u)) { var a = document.getElementById("login"); a.href = u + "/login"; a.hidden = false; }
    }).catch(function () {});
  </script>
</body>
</html>
